# User-home environment file for Docker Sandboxes, linked as ~/.sbxenv.yaml by
# `install.sh link`. sbx merges it into every environment definition, so the
# Dotfiles kit is added to every sandbox created from an env file.
#
# The kit is v3 (sbx/dotfiles/dotfiles.yaml). v3 kits compose only with v3
# kits, so every environment this merges into must use a v3 workload (for
# example `docker.io/docker/sbx-kit-kiro` with `agent: sbx-kit-kiro`) and v3
# mixins; a built-in agent shortcut such as `agent: kiro` is v2 and fails.
#
# One-time host prerequisite: allowlist this kit's Git source (default is
# Docker Hub only). The setting REPLACES the whole list, so keep existing
# entries:
#
#   sbx settings set kit.allowedSources '["docker.io/","github.com/stevenpelley/"]'
schemaVersion: "1"
kits:
  # Thin kit: clones the repo and runs install.sh all. `ref` pins the branch;
  # `dir` selects the kit directory inside the repo.
  - "git+https://github.com/stevenpelley/Dotfiles#ref=main&dir=sbx/dotfiles"
