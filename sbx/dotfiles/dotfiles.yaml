# syntax=docker/sandbox-kit:3
# yaml-language-server: $schema=https://raw.githubusercontent.com/docker/sandbox-kit-spec/main/schema/kit.schema.json
#
# Docker Sandboxes mixin for this Dotfiles repository. The content
# (dotfiles.dockerfile beside this file) clones the repository and runs
# `install.sh all` at image build, so the clone at /home/agent/Dotfiles, every
# tool, the nvim plugins and parsers, and the config symlinks arrive as a
# cached /home/agent overlay. The repo stays the single source of truth:
# nothing from it is copied into the kit, and upgrades inside a running
# sandbox are still `git pull` + `bash install.sh link`.
#
# Workload-neutral: the overlay is built on plain Ubuntu 24.04 with every tool
# as a release binary under ~/.local (and a private uv and node), so it runs
# on any v3 workload with glibc >= 2.39 and an `agent` user (uid 1000,
# HOME=/home/agent): tested on sbx/kiro, sbx/claude and
# docker/sandbox-templates:shell. The install hook runs `install.sh all`,
# which only installs what is missing; on such a workload that takes under a
# second and needs no network.
#
# Rebuilds: sbx rebuilds a kit when its source changes. A change to
# install.sh's pins (or anything else outside sbx/dotfiles/) may not count
# as one; bump `version` below to force the next create to rebuild.
#
# Consume it from Git, selecting this directory:
#   git+https://github.com/stevenpelley/Dotfiles#ref=main&dir=sbx/dotfiles
schemaVersion: "3"
kind: mixin
displayName: Personal dotfiles (stevenpelley)
description: >-
  Clones the Dotfiles repository to /home/agent/Dotfiles and runs its installer,
  linking bash/vim/nvim/zellij configuration into $HOME. Provides oh-my-bash,
  Neovim with its plugins, treesitter parsers and LSPs (pyright, vtsls, ruff),
  zellij, lefthook, gh with gh-stack, and jc/jello/jellex, all as release
  binaries built into the kit image and independent of the workload's
  packages. Kit upgrades inside a running sandbox are simply `git pull` in
  /home/agent/Dotfiles followed by `bash install.sh link`.
version: "2.0.0"
sourceUrl: https://github.com/stevenpelley/Dotfiles
# No licenses: the repository carries no license file.

args:
  ref:
    default: main
    pattern: '^[A-Za-z0-9._/-]+$'
    description: Dotfiles branch or tag cloned into the image (and pulled at boot)
    buildArg: DOTFILES_REF

capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # Install hooks run as root with only the env they declare (the
        # proxy variables, for downloads when the image is missing a tool).
        # usermod, not chsh: the DHI images have no /etc/shells. Then the
        # installer, which finds everything in the image and returns at once;
        # on a workload it does not fit it installs what is missing.
        - command: |
            usermod -s /usr/bin/bash agent
            su -l agent -c 'mkdir -p "$HOME/.cache"; bash "$HOME/Dotfiles/install.sh" all > "$HOME/.cache/dotfiles-install.log" 2>&1 || { tail -40 "$HOME/.cache/dotfiles-install.log"; exit 1; }'
          user: "0"
          env: [HTTP_PROXY, HTTPS_PROXY, NO_PROXY, http_proxy, https_proxy, no_proxy]
          description: Set agent login shell to bash; run install.sh all (a no-op when the image fits the workload)
      # Every boot: fast-forward the clone (the image's copy is as old as
      # the kit build), then re-run `link`. link must run after the runtime
      # writes the agents' context files (~/.claude, ~/.omp) and after the
      # agent kits' hooks, or it misses harnesses; it is idempotent and needs
      # no network. The pull is best-effort and bounded, so an offline boot
      # keeps the image's clone.
      startup:
        - command: |
            su -l agent -c 'mkdir -p "$HOME/.cache"; { timeout 30 git -C "$HOME/Dotfiles" pull --ff-only -q || echo "dotfiles: git pull failed; keeping the existing clone"; bash "$HOME/Dotfiles/install.sh" link; } > "$HOME/.cache/dotfiles-link.log" 2>&1 || echo "dotfiles link failed; see ~/.cache/dotfiles-link.log" >&2'
          user: "0"
          env: [HTTP_PROXY, HTTPS_PROXY, NO_PROXY, http_proxy, https_proxy, no_proxy]
          description: Pull the Dotfiles clone, then re-link dotfiles and agent skills/instructions into every detected harness

  - type: com.docker.sandbox/network-policy@1
    config:
      # The image build runs on the host and needs no grant. `install` covers
      # the install hook when the image lacks something on this workload;
      # `runtime` the startup `git pull`, nvim plugin/parser updates and
      # `install.sh upgrade`. Any new download host used by install.sh goes
      # in both.
      install:
        allow: &dotfiles-hosts
          # nvim, tree-sitter, gh, zellij, lefthook, uv and uv's Python
          # releases (both GitHub asset hosts are required: GitHub rotated
          # release downloads to release-assets.*), and gh extensions
          - github.com
          - api.github.com
          - objects.githubusercontent.com
          - release-assets.githubusercontent.com
          # nvim plugin clones and nvim-treesitter parser sources
          # (github.com/<repo>/archive/<rev>.tar.gz redirects here)
          - codeload.github.com
          # oh-my-bash installer
          - raw.githubusercontent.com
          # uv tools (jc, jello, jellex, ruff)
          - pypi.org
          - files.pythonhosted.org
          # the private node (install_node) and the LSP npm packages
          - nodejs.org
          - registry.npmjs.org
      runtime:
        allow: *dotfiles-hosts

  # A tool mixin contributes the body only; the workload decides where the
  # agent reads it. @1: the spec refuses to compose @1 and @2 together, and
  # the sbx/kiro and sbx/claude workloads accept both.
  # Inline `content` keeps the body in the descriptor.
  - type: com.docker.sandbox/agent-context@1
    config:
      content: |
        Do not `git commit --amend`, `git rebase`, or take any other action that
        would modify git commits and prevent the user from reviewing incremental
        changes using git without explicit instructions to do so.

        Do not push git branches without explicit instructions to do so.
